name: sync-github

on:
  schedule:
    # 每日 UTC 02:00（北京时间 10:00）
    - cron: '0 2 * * *'
  workflow_dispatch:

# 直接提交到 main，不再需要 pull-requests 权限
permissions:
  contents: write

concurrency:
  group: sync-github
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: 同步 GitHub 快照
        shell: bash
        env:
          GH_SYNC_TOKEN: ${{ secrets.GH_SYNC_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          node scripts/sync-github.mjs | tee "$RUNNER_TEMP/sync-report.md"

      - name: 校验构建（快照只读，不联网）
        run: npm run build

      - name: 无变更则结束
        id: diff
        run: |
          if git diff --quiet -- src/data/github; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "快照无变化，不提交。"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- src/data/github
          fi

      - name: 提交并推送 main
        if: steps.diff.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/github
          git commit -m "chore: 同步 GitHub 项目数据"
          # 先 rebase 到最新 main，避免和人工提交撞车；冲突会让本步骤失败而不是静默跳过
          git pull --rebase origin main
          # 推送失败即非零退出，工作流标红，不会静默成功
          git push origin HEAD:main
