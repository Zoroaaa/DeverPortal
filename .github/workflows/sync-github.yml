name: sync-github

on:
  schedule:
    # 每日 UTC 02:00（北京时间 10:00）
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-github
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: 同步 GitHub 快照
        env:
          GH_SYNC_TOKEN: ${{ secrets.GH_SYNC_TOKEN || secrets.GITHUB_TOKEN }}
        run: node scripts/sync-github.mjs | tee "$RUNNER_TEMP/sync-report.md"

      - name: 校验构建（快照只读，不联网）
        run: npm run build

      - name: 无变更则结束
        id: diff
        run: |
          if git diff --quiet -- src/data/github; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "快照无变化，不创建 PR。"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 创建或更新同步 PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B chore/github-sync
          git add src/data/github
          git commit -m "chore: 同步 GitHub 项目数据"
          # 只强推机器人自己的分支 chore/github-sync，main 受分支保护
          git push --force origin chore/github-sync

          {
            echo "## GitHub 项目数据同步"
            echo
            echo "自动抓取 src/data/github/*.json，构建仍只读本地快照。"
            echo
            echo "### 变更文件"
            echo '```'
            git diff --stat "origin/${{ github.event.repository.default_branch }}...HEAD" -- src/data/github || git show --stat --oneline HEAD
            echo '```'
            echo
            echo "### 同步报告"
            echo '```'
            cat "$RUNNER_TEMP/sync-report.md"
            echo '```'
            echo
            echo "合并后触发部署。手写内容（src/content/**）不会被本 PR 修改。"
          } > "$RUNNER_TEMP/pr-body.md"

          if gh pr list --head chore/github-sync --state open --json number --jq '.[0].number' | grep -q .; then
            gh pr edit chore/github-sync --body-file "$RUNNER_TEMP/pr-body.md"
            echo "已更新现有 PR。"
          else
            gh pr create \
              --title "chore: 同步 GitHub 项目数据" \
              --body-file "$RUNNER_TEMP/pr-body.md" \
              --base "${{ github.event.repository.default_branch }}" \
              --head chore/github-sync
          fi
